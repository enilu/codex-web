<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#080c12" />
    <title>Codex Access</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070a0f;
        --panel: rgba(13, 18, 25, 0.86);
        --panel-strong: #0d131b;
        --line: rgba(185, 207, 220, 0.16);
        --line-strong: rgba(91, 231, 185, 0.42);
        --text: #f5f8f7;
        --muted: #9aa9b5;
        --soft: #d0d8de;
        --green: #5be7b9;
        --cyan: #72d7ff;
        --amber: #f0c46c;
        --red: #ff8585;
        --shadow: 0 30px 100px rgba(0, 0, 0, 0.56);
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--bg);
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        overflow-x: hidden;
        background:
          radial-gradient(
            circle at 12% 8%,
            rgba(91, 231, 185, 0.15),
            transparent 30%
          ),
          radial-gradient(
            circle at 88% 86%,
            rgba(114, 215, 255, 0.1),
            transparent 29%
          ),
          linear-gradient(135deg, #070a0f 0%, #101720 52%, #08110f 100%);
        color: var(--text);
        font-family:
          "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      button,
      input {
        font: inherit;
      }

      .stage {
        position: relative;
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        min-height: 100dvh;
        place-items: center;
        padding: max(28px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(28px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
        isolation: isolate;
      }

      .grid {
        position: absolute;
        inset: 0;
        z-index: -3;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.045) 1px,
            transparent 1px
          );
        background-size: 56px 56px;
        mask-image: linear-gradient(
          to bottom,
          transparent 0%,
          #000 16%,
          #000 84%,
          transparent 100%
        );
      }

      .ambient {
        position: absolute;
        inset: 0 -15%;
        z-index: -2;
        background: linear-gradient(
          105deg,
          transparent 38%,
          rgba(114, 215, 255, 0.07) 49%,
          rgba(91, 231, 185, 0.11) 51%,
          transparent 62%
        );
        transform: translateX(-36%);
        animation: ambientSweep 11s ease-in-out infinite alternate;
        pointer-events: none;
      }

      .shell {
        width: min(100%, 960px);
        min-height: 540px;
        display: grid;
        grid-template-columns: minmax(0, 1.08fr) minmax(360px, 0.92fr);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: rgba(7, 11, 16, 0.68);
        box-shadow: var(--shadow);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }

      .signal {
        position: relative;
        min-height: 540px;
        padding: 34px;
        overflow: hidden;
        border-right: 1px solid var(--line);
        background:
          radial-gradient(
            circle at 10% 8%,
            rgba(91, 231, 185, 0.12),
            transparent 34%
          ),
          linear-gradient(145deg, rgba(255, 255, 255, 0.055), transparent 46%);
      }

      .brand,
      .mobile-brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        color: var(--soft);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .brand-mark {
        display: grid;
        width: 38px;
        height: 38px;
        flex: 0 0 auto;
        place-items: center;
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        background: rgba(91, 231, 185, 0.09);
        color: var(--green);
        font-family: Consolas, "SFMono-Regular", monospace;
        font-size: 18px;
        font-weight: 800;
        box-shadow: inset 0 0 22px rgba(91, 231, 185, 0.06);
      }

      .hero-copy {
        position: relative;
        z-index: 1;
        margin-top: 66px;
      }

      .display-title {
        color: var(--text);
        font-size: clamp(58px, 7vw, 78px);
        line-height: 0.95;
        font-weight: 850;
        letter-spacing: -0.055em;
      }

      .lead {
        max-width: 430px;
        margin: 20px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.75;
      }

      .terminal {
        position: relative;
        width: min(430px, 94%);
        margin-top: 38px;
        overflow: hidden;
        border: 1px solid rgba(114, 215, 255, 0.2);
        border-radius: 14px;
        background: rgba(3, 8, 12, 0.72);
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.34);
      }

      .terminal::after {
        content: "";
        position: absolute;
        width: 180px;
        height: 180px;
        top: -92px;
        right: -70px;
        border-radius: 50%;
        background: rgba(91, 231, 185, 0.08);
        filter: blur(18px);
      }

      .terminal-bar {
        display: flex;
        align-items: center;
        gap: 7px;
        height: 38px;
        padding: 0 15px;
        border-bottom: 1px solid rgba(185, 207, 220, 0.1);
      }

      .terminal-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(185, 207, 220, 0.28);
      }

      .terminal-dot:first-child {
        background: var(--green);
      }

      .terminal-body {
        display: grid;
        gap: 10px;
        min-height: 126px;
        align-content: center;
        padding: 22px 20px 24px;
        color: #a9bac5;
        font-family: Consolas, "SFMono-Regular", monospace;
        font-size: 12px;
        line-height: 1.5;
      }

      .terminal-line {
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .prompt {
        color: var(--green);
        font-weight: 800;
      }

      .ok {
        margin-left: auto;
        color: var(--green);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      .cursor {
        width: 7px;
        height: 14px;
        background: var(--cyan);
        animation: cursorBlink 1.1s steps(1, end) infinite;
      }

      .login {
        display: grid;
        align-content: center;
        padding: clamp(34px, 5vw, 52px);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.045), transparent 48%),
          var(--panel);
      }

      .mobile-brand {
        display: none;
        margin-bottom: 32px;
      }

      .login-header {
        margin-bottom: 28px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: var(--green);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .pulse {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 0 0 rgba(91, 231, 185, 0.66);
        animation: statusPulse 2s infinite;
      }

      h1 {
        margin: 13px 0 0;
        color: var(--text);
        font-size: clamp(29px, 4vw, 34px);
        line-height: 1.16;
        font-weight: 850;
        letter-spacing: -0.035em;
      }

      .hint {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.65;
      }

      form {
        display: grid;
        gap: 16px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: var(--soft);
        font-size: 13px;
        font-weight: 750;
      }

      .input-wrap {
        position: relative;
      }

      .input-icon {
        position: absolute;
        top: 50%;
        left: 15px;
        width: 18px;
        height: 18px;
        color: var(--muted);
        transform: translateY(-50%);
        pointer-events: none;
      }

      input {
        width: 100%;
        height: 54px;
        border: 1px solid rgba(185, 207, 220, 0.24);
        border-radius: 12px;
        background: rgba(3, 8, 12, 0.72);
        color: var(--text);
        font-size: 16px;
        outline: none;
        padding: 0 52px 0 44px;
        transition:
          border-color 0.18s ease,
          box-shadow 0.18s ease,
          background 0.18s ease;
      }

      input::placeholder {
        color: #778590;
      }

      input:hover {
        border-color: rgba(185, 207, 220, 0.38);
      }

      input:focus {
        border-color: var(--green);
        background: rgba(4, 12, 15, 0.9);
        box-shadow: 0 0 0 4px rgba(91, 231, 185, 0.12);
      }

      input[aria-invalid="true"] {
        border-color: var(--red);
        box-shadow: 0 0 0 4px rgba(255, 133, 133, 0.1);
      }

      .password-toggle {
        position: absolute;
        top: 50%;
        right: 6px;
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transform: translateY(-50%);
      }

      .password-toggle:hover {
        background: rgba(255, 255, 255, 0.055);
        color: var(--text);
      }

      .password-toggle svg {
        width: 19px;
        height: 19px;
      }

      .submit-button {
        display: inline-flex;
        width: 100%;
        height: 54px;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(128deg, var(--green), var(--cyan));
        color: #03100d;
        cursor: pointer;
        font-size: 16px;
        font-weight: 850;
        box-shadow: 0 14px 34px rgba(68, 210, 181, 0.13);
        transition:
          transform 0.18s ease,
          filter 0.18s ease,
          box-shadow 0.18s ease;
      }

      .submit-button:hover {
        filter: brightness(1.06);
        transform: translateY(-1px);
        box-shadow: 0 18px 42px rgba(68, 210, 181, 0.2);
      }

      .submit-button:active {
        transform: translateY(0);
      }

      .submit-button:disabled {
        cursor: wait;
        filter: saturate(0.55);
        opacity: 0.78;
        transform: none;
      }

      .submit-button svg {
        width: 18px;
        height: 18px;
      }

      .submit-button[aria-busy="true"] svg {
        animation: arrowWait 0.8s ease-in-out infinite alternate;
      }

      button:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 3px;
      }

      .error {
        min-height: 19px;
        color: var(--red);
        font-size: 13px;
        line-height: 1.45;
      }

      .error:empty {
        min-height: 0;
      }

      .trust {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 26px;
        padding-top: 20px;
        border-top: 1px solid rgba(185, 207, 220, 0.12);
        color: #7f909c;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.035em;
        text-transform: uppercase;
      }

      .trust svg {
        width: 14px;
        height: 14px;
        color: var(--green);
      }

      @keyframes ambientSweep {
        from {
          transform: translateX(-38%);
        }
        to {
          transform: translateX(38%);
        }
      }

      @keyframes statusPulse {
        70% {
          box-shadow: 0 0 0 9px rgba(91, 231, 185, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(91, 231, 185, 0);
        }
      }

      @keyframes cursorBlink {
        50% {
          opacity: 0;
        }
      }

      @keyframes arrowWait {
        to {
          transform: translateX(4px);
        }
      }

      @media (max-width: 820px) {
        .stage {
          min-height: 100vh;
          min-height: 100svh;
          min-height: 100dvh;
          padding: max(18px, env(safe-area-inset-top))
            max(14px, env(safe-area-inset-right))
            max(18px, env(safe-area-inset-bottom))
            max(14px, env(safe-area-inset-left));
        }

        .grid {
          background-size: 44px 44px;
          opacity: 0.76;
        }

        .shell {
          width: min(100%, 440px);
          min-height: 0;
          grid-template-columns: 1fr;
          border-radius: 20px;
        }

        .signal {
          display: none;
        }

        .login {
          padding: 28px 26px 26px;
        }

        .mobile-brand {
          display: inline-flex;
          margin-bottom: 28px;
        }

        .mobile-brand .brand-mark {
          width: 36px;
          height: 36px;
        }

        .login-header {
          margin-bottom: 24px;
        }

        h1 {
          font-size: 29px;
        }

        .hint {
          font-size: 14px;
        }

        .trust {
          margin-top: 24px;
        }
      }

      @media (max-width: 380px) {
        .login {
          padding: 24px 20px 22px;
        }

        .mobile-brand {
          margin-bottom: 24px;
        }

        h1 {
          font-size: 27px;
        }
      }

      @media (max-width: 820px) and (max-height: 620px) {
        .stage {
          place-items: start center;
        }

        .mobile-brand {
          margin-bottom: 20px;
        }

        .login-header {
          margin-bottom: 20px;
        }

        .trust {
          margin-top: 18px;
          padding-top: 16px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }

      @supports not (
        (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))
      ) {
        .shell {
          background: var(--panel-strong);
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="grid" aria-hidden="true"></div>
      <div class="ambient" aria-hidden="true"></div>

      <section class="shell" aria-label="Codex 登录">
        <aside class="signal" aria-label="Codex Remote Console">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true">&gt;</span>
            <span>Codex Remote Console</span>
          </div>

          <div class="hero-copy">
            <div class="display-title">Codex</div>
            <p class="lead">连接本机工作区、长任务和代理能力的远程控制台。</p>

            <div class="terminal" aria-hidden="true">
              <div class="terminal-bar">
                <span class="terminal-dot"></span>
                <span class="terminal-dot"></span>
                <span class="terminal-dot"></span>
              </div>
              <div class="terminal-body">
                <div class="terminal-line">
                  <span class="prompt">&gt;</span><span>workspace linked</span
                  ><span class="ok">READY</span>
                </div>
                <div class="terminal-line">
                  <span class="prompt">&gt;</span
                  ><span>secure tunnel active</span><span class="ok">OK</span>
                </div>
                <div class="terminal-line">
                  <span class="prompt">&gt;</span><span>waiting for access</span
                  ><span class="cursor"></span>
                </div>
              </div>
            </div>
          </div>
        </aside>

        <div class="login">
          <div class="mobile-brand" aria-label="Codex Remote Console">
            <span class="brand-mark" aria-hidden="true">&gt;</span>
            <span>Codex</span>
          </div>

          <header class="login-header">
            <span class="eyebrow"
              ><span class="pulse" aria-hidden="true"></span>Secure access</span
            >
            <h1>进入 Codex</h1>
            <p id="password-hint" class="hint">
              输入访问密码，建立到本机 Codex Web 的加密会话。
            </p>
          </header>

          <form method="post" action="codex-login" novalidate>
            <div>
              <label for="password">访问密码</label>
              <div class="input-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M7 10V8a5 5 0 0 1 10 0v2M6 10h12v10H6z"
                  />
                </svg>
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  required
                  aria-describedby="password-hint login-error"
                  placeholder="输入访问密码"
                />
                <button
                  class="password-toggle"
                  type="button"
                  aria-label="显示密码"
                  aria-pressed="false"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"
                    />
                    <circle
                      cx="12"
                      cy="12"
                      r="2.5"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    />
                  </svg>
                </button>
              </div>
            </div>

            <button class="submit-button" type="submit">
              <span>解锁 Codex</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M5 12h14M13 6l6 6-6 6"
                />
              </svg>
            </button>

            <div id="login-error" class="error" role="alert" aria-live="polite">
              {{CODEX_LOGIN_ERROR}}
            </div>
          </form>

          <div class="trust">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 3 5 6v5c0 4.8 2.7 8.2 7 10 4.3-1.8 7-5.2 7-10V6l-7-3Z"
              />
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m9 12 2 2 4-4"
              />
            </svg>
            <span>Encrypted tunnel · Local access only</span>
          </div>
        </div>
      </section>
    </main>

    <script>
      (() => {
        const form = document.querySelector("form");
        const password = document.querySelector("#password");
        const toggle = document.querySelector(".password-toggle");
        const submit = document.querySelector(".submit-button");
        const submitLabel = submit.querySelector("span");
        const error = document.querySelector("#login-error");

        toggle.addEventListener("click", () => {
          const reveal = password.type === "password";
          password.type = reveal ? "text" : "password";
          toggle.setAttribute("aria-pressed", String(reveal));
          toggle.setAttribute("aria-label", reveal ? "隐藏密码" : "显示密码");
          password.focus({ preventScroll: true });
        });

        form.addEventListener("submit", (event) => {
          if (!form.checkValidity()) {
            event.preventDefault();
            password.setAttribute("aria-invalid", "true");
            error.textContent = "请输入访问密码。";
            password.focus({ preventScroll: true });
            return;
          }

          password.removeAttribute("aria-invalid");
          error.textContent = "";
          submit.disabled = true;
          submit.setAttribute("aria-busy", "true");
          submitLabel.textContent = "正在验证…";
        });

        password.addEventListener("input", () => {
          if (password.value) {
            password.removeAttribute("aria-invalid");
            error.textContent = "";
          }
        });

        if (error.textContent.trim()) {
          password.setAttribute("aria-invalid", "true");
        }
      })();
    </script>
  </body>
</html>
